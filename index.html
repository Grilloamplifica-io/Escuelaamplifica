<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Academia Amplifica — Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --azul: #2952E3;
    --azul-deep: #1E3EAE;
    --navy: #0F1B3D;
    --navy-2: #16244D;
    --amber: #FFC530;
    --amber-ink: #6B4B00;
    --bg: #F3F5FB;
    --surface: #FFFFFF;
    --ink: #12182B;
    --ink-muted: #62697D;
    --success: #1E9E6C;
    --success-bg: #E6F5EE;
    --warning: #E8871E;
    --warning-bg: #FDF0E1;
    --danger: #D64545;
    --danger-bg: #FBE9E9;
    --border: #E3E7F0;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(15,27,61,.04), 0 8px 24px rgba(15,27,61,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.display{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    letter-spacing:.2px;
    margin:0;
  }
  .mono{ font-family:'JetBrains Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:inherit; text-decoration:none; }
  ::selection{ background:var(--amber); }

  /* ---------- Shell ---------- */
  #shell{
    display:grid;
    grid-template-columns:232px 1fr;
    min-height:100vh;
  }
  #shell.mobile-preview{
    max-width:420px;
    margin:0 auto;
    box-shadow:0 0 0 1px var(--border), 0 30px 60px rgba(15,27,61,.18);
    grid-template-columns:1fr;
    grid-template-rows:1fr auto;
    min-height:860px;
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    background:linear-gradient(180deg,var(--navy),var(--navy-2));
    color:#fff;
    padding:22px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  #shell.mobile-preview #sidebar{ display:none; }
  .brand{
    display:flex;
    align-items:baseline;
    gap:6px;
    padding:4px 10px 22px;
  }
  .brand .mark{
    width:9px;height:9px;border-radius:3px;background:var(--amber);
    display:inline-block; transform:rotate(45deg); margin-right:2px;
  }
  .brand-title{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:19px; letter-spacing:.5px; text-transform:uppercase; color:#fff;
  }
  .brand-sub{
    font-size:10.5px; color:#9AA6C9; letter-spacing:1.6px; text-transform:uppercase; margin-top:2px;
  }
  .navgroup-label{
    font-size:10.5px; color:#7C89B5; text-transform:uppercase; letter-spacing:1.4px;
    padding:14px 10px 6px;
  }
  .navitem{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:9px;
    color:#C7CEE8; font-size:14.5px; font-weight:500;
    border-left:3px solid transparent;
  }
  .navitem:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .navitem.active{
    background:rgba(255,255,255,.09);
    color:#fff;
    border-left:3px solid var(--amber);
  }
  .navitem .ico{ width:17px; text-align:center; opacity:.9; font-size:14px; }
  .sidebar-foot{
    margin-top:auto; padding:14px 10px 4px; border-top:1px solid rgba(255,255,255,.1);
    font-size:11px; color:#7C89B5; line-height:1.5;
  }

  /* ---------- Bottom nav (mobile) ---------- */
  #bottomnav{ display:none; }
  #shell.mobile-preview #bottomnav{
    display:flex; justify-content:space-around;
    background:var(--navy); padding:8px 4px 10px; border-top:1px solid rgba(255,255,255,.08);
  }
  #bottomnav .navitem{
    flex-direction:column; gap:3px; text-align:center; font-size:10.5px; border-left:none;
    border-top:2px solid transparent; border-radius:0; padding:6px 8px;
  }
  #bottomnav .navitem.active{ border-top:2px solid var(--amber); border-left:none; }
  #bottomnav .ico{ font-size:16px; }

  /* ---------- Main ---------- */
  #main{ min-width:0; display:flex; flex-direction:column; }
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; background:var(--surface); border-bottom:1px solid var(--border);
    gap:14px; flex-wrap:wrap;
  }
  #shell.mobile-preview #topbar{ padding:14px 16px; }
  .crumb{ font-size:13px; color:var(--ink-muted); }
  .crumb b{ color:var(--ink); font-weight:600; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  select.picker{
    border:1px solid var(--border); background:var(--surface); border-radius:9px;
    padding:7px 10px; font-size:13px; font-weight:500; color:var(--ink);
  }
  .icon-btn{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-muted);
  }
  .icon-btn.on{ background:var(--navy); color:#fff; border-color:var(--navy); }

  #view{ padding:26px 28px 60px; max-width:1180px; width:100%; margin:0 auto; }
  #shell.mobile-preview #view{ padding:16px; }

  /* ---------- Generic components ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px;
  }
  .grid{ display:grid; gap:16px; }
  .cols-4{ grid-template-columns:repeat(4,1fr); }
  .cols-3{ grid-template-columns:repeat(3,1fr); }
  .cols-2{ grid-template-columns:2fr 1fr; }
  @media (max-width:900px){ .cols-4{grid-template-columns:repeat(2,1fr);} .cols-3{grid-template-columns:1fr;} .cols-2{grid-template-columns:1fr;} }
  #shell.mobile-preview .cols-4{ grid-template-columns:repeat(2,1fr); }
  #shell.mobile-preview .cols-3, #shell.mobile-preview .cols-2{ grid-template-columns:1fr; }

  .btn{
    display:inline-flex; align-items:center; gap:8px; border-radius:10px; border:1px solid transparent;
    padding:10px 16px; font-size:13.5px; font-weight:600; font-family:'Inter',sans-serif;
  }
  .btn-primary{ background:var(--azul); color:#fff; }
  .btn-primary:hover{ background:var(--azul-deep); }
  .btn-accent{ background:var(--amber); color:var(--amber-ink); }
  .btn-outline{ background:var(--surface); color:var(--ink); border-color:var(--border); }
  .btn-outline:hover{ background:#F7F8FC; }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; padding:3px 9px; border-radius:99px; }
  .badge-normativo{ background:#E7ECFC; color:var(--azul-deep); }
  .badge-interna{ background:#EEF0F5; color:var(--ink-muted); }
  .badge-aprobado{ background:var(--success-bg); color:var(--success); }
  .badge-pendiente{ background:var(--warning-bg); color:var(--warning); }
  .badge-desarrollo{ background:#E7ECFC; color:var(--azul-deep); }
  .badge-vencido{ background:var(--danger-bg); color:var(--danger); }

  .progress{ height:7px; background:#EBEDF4; border-radius:99px; overflow:hidden; }
  .progress > span{ display:block; height:100%; background:var(--azul); border-radius:99px; }

  .eyebrow{ font-size:11.5px; text-transform:uppercase; letter-spacing:1.4px; color:var(--ink-muted); font-weight:700; margin-bottom:6px; }
  .muted{ color:var(--ink-muted); }
  .h-title{ font-size:26px; }
  .divider{ height:1px; background:var(--border); margin:18px 0; }

  /* crest badge (escuela monogram) */
  .crest{
    width:42px;height:42px;border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; color:#fff; letter-spacing:.5px;
    flex-shrink:0;
  }
  .crest.sm{ width:30px; height:30px; font-size:11px; border-radius:9px; }

  /* ---------- Home ---------- */
  .stat-card{ display:flex; flex-direction:column; gap:6px; }
  .stat-num{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:30px; }
  .stat-label{ font-size:12.5px; color:var(--ink-muted); font-weight:600; }
  .continue-card{ display:flex; gap:16px; align-items:center; }
  .continue-thumb{ width:88px; height:64px; border-radius:10px; flex-shrink:0; background:linear-gradient(135deg,var(--navy),var(--azul)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; }
  .venc-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
  .venc-row:last-child{ border-bottom:none; }

  /* ---------- Catálogo ---------- */
  .search-bar{ display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
  .search-bar input{ flex:1; min-width:180px; padding:11px 14px; border-radius:10px; border:1px solid var(--border); font-size:13.5px; font-family:inherit; }
  .chip{ padding:8px 13px; border-radius:99px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:600; color:var(--ink-muted); }
  .chip.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .escuela-row{ margin-bottom:30px; }
  .escuela-row-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .escuela-row-head .h4{ font-size:17px; }
  .hscroll{ display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; }
  .course-card{ min-width:230px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); flex-shrink:0; }
  .course-card .thumb{ height:78px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; }
  .course-card .body{ padding:13px; display:flex; flex-direction:column; gap:8px; }
  .course-card .title{ font-size:14px; font-weight:700; line-height:1.3; }

  /* ---------- Curso / player ---------- */
  .module-row{ display:flex; align-items:center; gap:12px; padding:12px 10px; border-radius:10px; border:1px solid transparent; }
  .module-row.active{ background:#EEF1FB; border-color:var(--border); }
  .module-row .dot{ width:24px;height:24px;border-radius:99px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
  .module-row.done .dot{ background:var(--success); border-color:var(--success); color:#fff; }
  .player-stage{ background:var(--navy); border-radius:var(--radius); aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; color:#fff; flex-direction:column; gap:10px; }
  .checklist-item{ display:flex; gap:10px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .checklist-item:last-child{ border-bottom:none; }
  .checklist-item input{ margin-top:3px; }

  /* ---------- Evaluación ---------- */
  .opt{ display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:9px; font-size:14px; }
  .opt:hover{ border-color:var(--azul); }
  .opt.correct{ border-color:var(--success); background:var(--success-bg); }
  .opt.incorrect{ border-color:var(--danger); background:var(--danger-bg); }

  /* ---------- Certificado ---------- */
  .cert{ border:2px solid var(--navy); border-radius:16px; overflow:hidden; }
  .cert-top{ background:var(--navy); color:#fff; padding:22px 30px; display:flex; justify-content:space-between; align-items:center; }
  .cert-body{ padding:36px 40px; text-align:center; }
  .cert-name{ font-family:'Barlow Condensed',sans-serif; font-size:34px; font-weight:700; margin:8px 0 4px; }
  .qr{ display:inline-grid; grid-template-columns:repeat(7,7px); grid-template-rows:repeat(7,7px); gap:1px; padding:8px; background:#fff; border:1px solid var(--border); border-radius:8px; }
  .qr span{ background:var(--navy); }
  .qr span.off{ background:transparent; }

  /* ---------- Perfil / pasaporte ---------- */
  .profile-head{ display:flex; align-items:center; gap:18px; }
  .avatar{ width:64px;height:64px;border-radius:16px; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; }
  .ring{ transform:rotate(-90deg); }
  .passport{ display:flex; gap:16px; flex-wrap:wrap; padding:6px 0; }
  .stamp{
    width:78px; height:78px; border-radius:50%; border:2px dashed var(--azul);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    color:var(--azul-deep); position:relative; flex-shrink:0;
  }
  .stamp.locked{ border-color:var(--border); color:var(--ink-muted); opacity:.55; border-style:dashed; }
  .stamp .ini{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; }
  .stamp .tag{ font-size:7px; letter-spacing:1px; text-transform:uppercase; font-weight:700; }
  .stamp:nth-child(2n){ transform:rotate(-6deg); }
  .stamp:nth-child(3n){ transform:rotate(5deg); }

  /* ---------- Tables ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-muted); font-weight:700; padding:9px 10px; border-bottom:1px solid var(--border); }
  td{ padding:11px 10px; border-bottom:1px solid var(--border); }
  tr:last-child td{ border-bottom:none; }

  /* ---------- Admin rules ---------- */
  .rule-card{ display:flex; align-items:center; gap:14px; padding:15px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; background:#FBFCFE; }
  .rule-pill{ background:var(--navy); color:#fff; font-family:'JetBrains Mono',monospace; font-size:11.5px; padding:5px 9px; border-radius:7px; }
  .arrow{ color:var(--ink-muted); }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; }
  .tab{ padding:10px 4px; margin-right:22px; font-size:13.5px; font-weight:600; color:var(--ink-muted); border-bottom:2px solid transparent; }
  .tab.active{ color:var(--ink); border-bottom-color:var(--amber); }

  .empty{ text-align:center; padding:50px 20px; color:var(--ink-muted); }
  .toggle{ width:38px; height:22px; border-radius:99px; background:var(--border); position:relative; display:inline-block; flex-shrink:0; }
  .toggle.on{ background:var(--azul); }
  .toggle .knob{ width:16px;height:16px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.3); }
  .toggle.on .knob{ left:19px; }

  [data-fade]{ animation:fadein .18s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  @media (max-width:820px){
    #shell{ grid-template-columns:1fr; grid-template-rows:1fr auto; }
    #sidebar{ display:none; }
    #bottomnav{ display:flex; justify-content:space-around; background:var(--navy); padding:8px 4px 10px; border-top:1px solid rgba(255,255,255,.08); }
    #bottomnav .navitem{ flex-direction:column; gap:3px; text-align:center; font-size:10.5px; border-left:none; border-top:2px solid transparent; border-radius:0; padding:6px 8px; }
    #bottomnav .navitem.active{ border-top:2px solid var(--amber); border-left:none; }
    #view{ padding:16px; }
  }
</style>
</head>
<body>

<div id="shell">
  <aside id="sidebar"></aside>
  <div id="main">
    <div id="topbar"></div>
    <div id="view"></div>
  </div>
  <nav id="bottomnav"></nav>
</div>

<script>
/* =========================================================
   DATOS DE EJEMPLO — Academia Amplifica (prototipo)
   ========================================================= */
const ESCUELAS = [

const CURSOS = [

  {id:'c5', escuela:'com', nombre:'Manejo de Objeciones en Venta B2B', tipo:'interna', duracion:'35 min', nivel:'Especialización',

  {id:'c7', escuela:'lid', nombre:'Nuevo Líder: Primeros 90 Días', tipo:'interna', duracion:'50 min', nivel:'Liderazgo',

  {id:'c8', escuela:'fin', nombre:'Cómo Gana Dinero Amplifica', tipo:'interna', duracion:'20 min', nivel:'Fundamentos',

  {id:'c9', escuela:'cs', nombre:'Ciclo de Vida del Cliente', tipo:'interna', duracion:'25 min', nivel:'Fundamentos',
    modulos:[{t:'De onboarding a renovación', tipo:'video'},{t:'Señales de riesgo de fuga', tipo:'video'}]},
];
function curso(id){ return CURSOS.find(c=>c.id===id); }

const USERS = {
  u1:{id:'u1', nombre:'Camila Soto', cargo:'Analista Comercial', rol:'colaborador', contexto:'oficina', escuela:'com', color:'#2952E3',
      asign:{c1:'aprobado', c5:'desarrollo', c2:'pendiente', c6:'aprobado'}, progreso:{c5:60},

let state = { route:'home', params:{}, device:'desktop', moduloIdx:0, checklistDone:{}, quizAnswers:{}, quizSubmitted:false, simMode:false };

function go(route, params={}){
  state.route = route; state.params = params; state.moduloIdx = 0;
  state.quizAnswers = {}; state.quizSubmitted = false;
  window.location.hash = '#/'+route+(params.id? '/'+params.id : '');
  render();
}

function parseHash(){
  const h = window.location.hash.replace('#/','');
  const [route, id] = h.split('/');
  state.route = route || 'home';
  state.params = id? {id} : {};
}
window.addEventListener('hashchange', ()=>{ parseHash(); render(); });

function crest(escuelaObj, sm){
  return `<div class="crest ${sm?'sm':''}" style="background:${escuelaObj.color}">${escuelaObj.ini}</div>`;
}
function badgeEstado(estado){
  const map = {
    aprobado:['badge-aprobado','Aprobado'],
    pendiente:['badge-pendiente','Pendiente'],
    desarrollo:['badge-desarrollo','En desarrollo'],
    vencido:['badge-vencido','Vencido'],
  };
  const [cls,label] = map[estado] || map.pendiente;
  return `<span class="badge ${cls}">${label}</span>`;
}
function badgeTipo(tipo){
  return tipo==='normativo'
    ? `<span class="badge badge-normativo">Normativo</span>`
    : `<span class="badge badge-interna">Interna</span>`;
}
function courseCard(c){
  const e = escuela(c.escuela);
  const estado = me().asign[c.id];
  return `

}
function iconFor(tipo){
  return {video:'▶', pdf:'▤', checklist:'☑'}[tipo] || '▶';

function viewEvaluacion(id){
  const c = curso(id);
  if(!c.quiz){ return `<div class="empty">Este curso no tiene evaluación configurada en el prototipo.</div>`; }
  const submitted = state.quizSubmitted;
  let correctCount = 0;
  const preguntasHtml = c.quiz.map((p,qi)=>{
    const chosen = state.quizAnswers[qi];
    if(submitted && chosen===p.correcta) correctCount++;
    return `
    <div class="card" style="margin-bottom:14px">
      <div style="font-weight:700; margin-bottom:12px">${qi+1}. ${p.q}</div>
      ${p.ops.map((op,oi)=>{
        let cls='';
        if(submitted){
          if(oi===p.correcta) cls='correct';
          else if(oi===chosen) cls='incorrect';
        } else if(chosen===oi){ cls='correct'; }
        return `<div class="opt ${cls}" data-action="${submitted?'':'quiz-select'}" data-q="${qi}" data-o="${oi}">
          <span>${op}</span>
        </div>`;
      }).join('')}
      ${submitted? `<div class="muted" style="font-size:12.5px; margin-top:8px">${p.feedback}</div>` : ''}
    </div>`;
  }).join('');

  const scorePct = submitted ? Math.round((correctCount/c.quiz.length)*100) : null;
  const aprobado = scorePct!==null && scorePct>=80;

  return `
  <div data-fade>
    <div class="eyebrow">${escuela(c.escuela).nombre} · Evaluación de cierre</div>
    <h1 class="h-title" style="margin-bottom:16px">${c.nombre}</h1>
    ${preguntasHtml}
    ${!submitted
      ? `<button class="btn btn-primary" data-action="quiz-submit" data-id="${c.id}" ${Object.keys(state.quizAnswers).length<c.quiz.length?'disabled':''}>Enviar evaluación</button>`
      : `<div class="card" style="text-align:center; background:${aprobado?'var(--success-bg)':'var(--danger-bg)'}; border:none">
           <div class="display" style="font-size:22px; color:${aprobado?'var(--success)':'var(--danger)'}">${aprobado? '¡Aprobado!' : 'Aún no aprueba'} · ${scorePct}%</div>
           <div class="muted" style="margin:6px 0 14px">Puntaje mínimo de aprobación: 80%</div>
           ${aprobado
             ? `<button class="btn btn-accent" data-action="ir-certificado" data-id="${c.id}">Ver mi certificado →</button>`
             : `<button class="btn btn-outline" data-action="ir-evaluacion" data-id="${c.id}">Reintentar evaluación</button>`}
         </div>`}
  </div>`;
}

        <div class="card">
          <div class="eyebrow">Bloque 3 · Mis certificados</div>
          ${u.cert.length? u.cert.map(cert=>`
            <div class="venc-row">
              <span>${curso(cert.cursoId).nombre} <span class="muted">· ${cert.fecha}</span></span>
              <button class="btn btn-outline btn-sm" data-action="ir-certificado" data-id="${cert.cursoId}">Ver</button>
            </div>`).join('') : `<div class="muted" style="font-size:13px">Aún no tienes certificados.</div>`}
        </div>
      </div>
    </div>
  </div>`;
}

function viewEquipo(){
  const total = EQUIPO_DANIELA.length;
  const avg = Math.round(EQUIPO_DANIELA.reduce((a,p)=>a+p.cumplimiento,0)/total);
  return `
  <div data-fade>
    <h1 class="h-title">Dashboard de tu equipo</h1>
    <div class="muted" style="margin:6px 0 20px">La jerarquía viene del HRIS — no requiere configuración adicional.</div>
    <div class="grid cols-4" style="margin-bottom:20px">
      <div class="card stat-card"><div class="stat-num">${avg}%</div><div class="stat-label">Cumplimiento del equipo</div></div>
      <div class="card stat-card"><div class="stat-num">${EQUIPO_DANIELA.reduce((a,p)=>a+p.pendientes,0)}</div><div class="stat-label">Cursos pendientes</div></div>
      <div class="card stat-card"><div class="stat-num">1</div><div class="stat-label">Evaluaciones reprobadas</div></div>
      <div class="card stat-card"><div class="stat-num">30 días</div><div class="stat-label">Ventana de vencimiento</div></div>
    </div>
    <div class="card" style="margin-bottom:20px">
      <div class="eyebrow">Cumplimiento por persona</div>
      <table>
        <tr><th>Colaborador</th><th>Cumplimiento</th><th>Pendientes</th><th></th></tr>
        ${EQUIPO_DANIELA.map(p=>`
          <tr>
            <td>${p.nombre}</td>
            <td style="width:160px"><div class="progress"><span style="width:${p.cumplimiento}%; background:${p.cumplimiento<60?'var(--danger)':'var(--azul)'}"></span></div></td>
            <td>${p.pendientes}</td>
            <td>${p.pendientes>0?`<button class="btn btn-outline btn-sm">Enviar recordatorio</button>`:''}</td>
          </tr>`).join('')}
      </table>
    </div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center">
        <div>
          <div class="eyebrow" style="margin-bottom:2px">Ranking del equipo</div>
          <div class="muted" style="font-size:12.5px">Desactivado por defecto — activable solo por decisión del líder, nunca comparado entre bodega y oficina.</div>
        </div>
        <div class="toggle" id="rankingToggle"><div class="knob"></div></div>
      </div>
    </div>
  </div>`;
}

function viewAdmin(){
  const tab = state.params.tab || 'reglas';
  return `
  <div data-fade>
    <h1 class="h-title">Administración</h1>
    <div class="tabs" style="margin-top:14px">
      <div class="tab ${tab==='reglas'?'active':''}" data-action="admin-tab" data-tab="reglas">Motor de reglas</div>
      <div class="tab ${tab==='escuelas'?'active':''}" data-action="admin-tab" data-tab="escuelas">Escuelas</div>
    </div>
    ${tab==='reglas' ? adminReglas() : adminEscuelas()}
  </div>`;
}
function adminReglas(){
  return `
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <div class="eyebrow" style="margin:0">Reglas activas de enrolamiento automático</div>
      <div style="display:flex; align-items:center; gap:10px">
        <span class="muted" style="font-size:12.5px">Modo simulación</span>
        <div class="toggle ${state.simMode?'on':''}" data-action="toggle-sim"><div class="knob"></div></div>
      </div>
    </div>
    <div class="divider"></div>
    ${REGLAS.map(r=>`
      <div class="rule-card">
        <span class="rule-pill">SI</span>
        <span style="font-size:13.5px">${r.cond}</span>
        <span class="arrow">→</span>
        <span class="rule-pill" style="background:var(--azul)">ENTONCES</span>
        <span style="font-size:13.5px">${r.accion}</span>
      </div>`).join('')}
    <button class="btn btn-primary btn-sm">+ Nueva regla</button>
    ${state.simMode ? `<div class="card" style="margin-top:14px; background:var(--success-bg); border:none">
        <b style="color:var(--success)">Simulación:</b> esta regla afectaría a <b>18 colaboradores</b> de Operaciones que aún no tienen la Escuela asignada. Ningún cambio se aplicará hasta activar la regla.
      </div>` : ''}
  </div>`;
}
function adminEscuelas(){
  return `
  <div class="card">
    <div class="eyebrow">Escuelas de la Academia</div>
    <table>
      <tr><th>Escuela</th><th>Owner</th><th>Cursos</th><th>Estado</th></tr>
      ${ESCUELAS.map(e=>`
        <tr>
          <td style="display:flex; align-items:center; gap:8px">${crest(e,true)} ${e.nombre}</td>
          <td>${e.owner}</td>
          <td>${CURSOS.filter(c=>c.escuela===e.id).length}</td>
          <td><span class="badge badge-aprobado">Activa</span></td>
        </tr>`).join('')}
    </table>
  </div>`;
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function render(){
  renderSidebar();
  renderTopbar();
  const view = document.getElementById('view');
  const r = state.route, p = state.params.id;
  const map = {
    home: ()=>viewHome(),
    catalogo: ()=>viewCatalogo(),
    curso: ()=>viewCurso(p),
    reproductor: ()=>viewReproductor(p),
    evaluacion: ()=>viewEvaluacion(p),
    certificado: ()=>viewCertificado(p),
    perfil: ()=>viewPerfil(),
    equipo: ()=>viewEquipo(),
    admin: ()=>viewAdmin(),
  };
  view.innerHTML = (map[r]||map.home)();
  window.scrollTo(0,0);
}

/* =========================================================
   DELEGACIÓN DE EVENTOS
   ========================================================= */
document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  if(action==='nav'){ go(t.dataset.route); }
  else if(action==='ir-curso'){ go('curso', {id:t.dataset.id}); }
  else if(action==='ir-reproductor'){ go('reproductor', {id:t.dataset.id}); }
  else if(action==='ir-evaluacion'){ go('evaluacion', {id:t.dataset.id}); }
  else if(action==='ir-certificado'){ go('certificado', {id:t.dataset.id}); }
  else if(action==='modulo-next'){ state.moduloIdx++; state.checklistDone={}; render(); }
  else if(action==='modulo-prev'){ state.moduloIdx=Math.max(0,state.moduloIdx-1); state.checklistDone={}; render(); }
  else if(action==='check-item'){ /* handled by change on checkbox, no-op on row click */ }
  else if(action==='quiz-select'){ state.quizAnswers[t.dataset.q]=Number(t.dataset.o); render(); }
  else if(action==='quiz-submit'){ state.quizSubmitted=true; render(); }
  else if(action==='admin-tab'){ state.params.tab=t.dataset.tab; render(); }
  else if(action==='toggle-sim'){ state.simMode=!state.simMode; render(); }
  else if(t.id==='rankingToggle'){ t.classList.toggle('on'); }
});
document.addEventListener('change', (e)=>{
  if(e.target.matches('[data-action="check-item"]')){
    state.checklistDone[e.target.dataset.idx] = e.target.checked;
  }
});

/* init */
parseHash();
render();
</script>
</body>
</html>
